services:
  - type: web
    name: markdown-task-manager
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PM_APP_TOKEN
        generateValue: true
      - key: PM_VAULT_ROOT
        value: /vault
      - key: PM_GITHUB_SYNC_ENABLED
        value: "false"
      - key: PM_GITHUB_REPO
        sync: false
      - key: PM_GITHUB_TOKEN
        sync: false
    disk:
      name: markdown-vault
      mountPath: /vault
      sizeGB: 1
