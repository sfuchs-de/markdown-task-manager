services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PM_APP_TOKEN: "${PM_APP_TOKEN:-}"
      PM_VAULT_ROOT: /vault
      PM_OUTPUT_ROOT: /vault/.generated
    volumes:
      - ./vault:/vault
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
