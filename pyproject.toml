[project]
name = "research-workbench"
version = "1.1.0"
description = "A configurable, Markdown-first research project workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  {name = "Simon Fuchs"},
]
dependencies = [
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "icalendar>=5.0",
  "recurring-ical-events>=2.3",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2.0,<3",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
